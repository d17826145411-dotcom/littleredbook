<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日主五行发展城市测算</title>
    <style>
        :root {
            --primary: #1a3a4a;
            --secondary: #d4af37;
            --bg: #f5f2eb;
            --card: #ffffff;
            --text: #2c3e50;
            --text-light: #666;
            --border: #e0d8c8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(26, 58, 74, 0.08);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary);
            font-size: 15px;
        }

        .date-select {
            display: flex;
            gap: 10px;
        }

        .date-select select {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }

        .date-select select:focus {
            border-color: var(--secondary);
        }

        .captcha-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .captcha-input:focus {
            border-color: var(--secondary);
        }

        #captchaCanvas {
            width: 120px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #fafafa;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background: #244d61;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .error-tip {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            min-height: 18px;
        }

        /* 结果区域 */
        .result-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background: linear-gradient(135deg, #1a3a4a 0%, #2c5364 100%);
            color: white;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
        }

        .result-daymaster {
            font-size: 36px;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .result-element {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .result-desc {
            font-size: 14px;
            opacity: 0.85;
            line-height: 1.6;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 3px solid var(--secondary);
        }

        .city-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .city-tag {
            padding: 6px 14px;
            background: #f0ebe0;
            color: var(--primary);
            border-radius: 20px;
            font-size: 14px;
        }

        .suggestion {
            background: #faf8f3;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.7;
            font-size: 14px;
            color: var(--text-light);
            border-left: 3px solid var(--secondary);
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 25px;
        }

        .reset-btn:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 480px) {
            .title { font-size: 24px; }
            .card { padding: 20px 18px; }
            .result-daymaster { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">日主发展城市测算</h1>
        <p class="subtitle">输入出生日期，查看适合你的发展方位</p>

        <div class="card">
            <!-- 输入表单 -->
            <div id="formSection">
                <div class="form-group">
                    <label class="form-label">出生日期（公历）</label>
                    <div class="date-select">
                        <select id="year"></select>
                        <select id="month"></select>
                        <select id="day"></select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="captcha-group">
                        <input type="text" id="captchaInput" class="captcha-input" placeholder="请输入验证码" maxlength="4">
                        <canvas id="captchaCanvas" width="120" height="42" title="点击刷新"></canvas>
                    </div>
                </div>

                <button class="submit-btn" onclick="calculate()">开始测算</button>
                <div class="error-tip" id="errorTip"></div>
            </div>

            <!-- 结果展示 -->
            <div id="resultSection" class="result-section">
                <div class="result-card">
                    <div class="result-daymaster" id="daymasterText">-</div>
                    <div class="result-element" id="elementText">-</div>
                    <div class="result-desc" id="descText">-</div>
                </div>

                <div class="section-title">推荐发展城市</div>
                <div class="city-list" id="cityList"></div>

                <div class="section-title">发展建议</div>
                <div class="suggestion" id="suggestionText"></div>

                <button class="reset-btn" onclick="resetForm()">重新测算</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentCaptcha = '';

        // 初始化年月日下拉框
        function initDateSelect() {
            const yearSel = document.getElementById('year');
            const monthSel = document.getElementById('month');
            const daySel = document.getElementById('day');

            // 年份 1930-2030
            for (let y = 2030; y >= 1930; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y + ' 年';
                yearSel.appendChild(opt);
            }
            yearSel.value = 2000;

            // 月份
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m + ' 月';
                monthSel.appendChild(opt);
            }

            // 日期
            updateDays();
            monthSel.addEventListener('change', updateDays);
            yearSel.addEventListener('change', updateDays);
        }

        // 根据年月更新日期选项
        function updateDays() {
            const y = parseInt(document.getElementById('year').value);
            const m = parseInt(document.getElementById('month').value);
            const daySel = document.getElementById('day');
            const days = new Date(y, m, 0).getDate();
            const currentDay = parseInt(daySel.value) || 1;

            daySel.innerHTML = '';
            for (let d = 1; d <= days; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d + ' 日';
                daySel.appendChild(opt);
            }
            daySel.value = Math.min(currentDay, days);
        }

        // 生成验证码
        function generateCaptcha() {
            const canvas = document.getElementById('captchaCanvas');
            const ctx = canvas.getContext('2d');
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 去掉易混淆字符
            let code = '';

            // 清空画布
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 生成4位字符
            for (let i = 0; i < 4; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                code += char;

                ctx.font = 'bold 22px Arial';
                ctx.fillStyle = `rgb(${30+Math.random()*50}, ${60+Math.random()*50}, ${80+Math.random()*50})`;
                ctx.save();
                ctx.translate(20 + i * 25, 28);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(char, 0, 0);
                ctx.restore();
            }

            // 干扰线
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = `rgba(150,150,150,${0.3+Math.random()*0.3})`;
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }

            // 噪点
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = `rgba(100,100,100,${Math.random()*0.5})`;
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 1.5, 1.5);
            }

            currentCaptcha = code;
        }

        // 计算日柱天干
        function getDayMaster(year, month, day) {
            // 1月、2月按上一年13、14月计算
            let y = year;
            let m = month;
            if (m <= 2) {
                y -= 1;
                m += 12;
            }

            const C = Math.floor(y / 100); // 世纪前两位
            const Y = y % 100; // 年份后两位

            // 日柱天干计算公式
            const G = 4 * C + Math.floor(C / 4) + 5 * Y + Math.floor(Y / 4) + Math.floor(3 * (m + 1) / 5) + day - 3;
            const ganIndex = G % 10;

            const tianGan = ['癸', '甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬'];
            return tianGan[ganIndex];
        }

        // 日主数据配置
        const daymasterData = {
            '甲': {
                element: '阳木',
                elementType: '木',
                desc: '生机勃勃，积极向上，有仁爱之心，善于开拓进取，适合在成长型环境中发展。',
                cities: ['上海', '杭州', '南京', '苏州', '青岛', '宁波', '无锡'],
                suggestion: '东方属木，与你的日主气场相合。东部沿海城市经济活力强、文创与新兴产业发达，能助你发挥领导力与创造力，事业上升空间更大。'
            },
            '乙': {
                element: '阴木',
                elementType: '木',
                desc: '柔韧内敛，心思细腻，善于协调沟通，有很强的适应力与韧性，适合精细化领域。',
                cities: ['上海', '杭州', '南京', '苏州', '青岛', '宁波', '无锡'],
                suggestion: '东方木地最能滋养乙木之气。长三角地区人文环境温和，服务业、设计、教育、传媒行业机会众多，适合稳步积累、厚积薄发。'
            },
            '丙': {
                element: '阳火',
                elementType: '火',
                desc: '热情开朗，光明磊落，有感染力与号召力，适合在聚光灯下展现自我价值。',
                cities: ['广州', '深圳', '厦门', '长沙', '重庆', '福州', '南宁'],
                suggestion: '南方属火，与你能量同频。粤港澳及南部城市节奏快、商业氛围浓厚，互联网、贸易、文娱产业发达，利于你施展才华、扩大影响力。'
            },
            '丁': {
                element: '阴火',
                elementType: '火',
                desc: '外柔内刚，心思缜密，专注度极高，适合在技术、艺术、研究领域深耕。',
                cities: ['广州', '深圳', '厦门', '长沙', '重庆', '福州', '南宁'],
                suggestion: '南方火地可补足你的能量。南部城市的高科技、文创、餐饮与服务业赛道丰富，适合你凭借专业技能和持久力站稳脚跟。'
            },
            '戊': {
                element: '阳土',
                elementType: '土',
                desc: '稳重踏实，诚信可靠，有很强的承载力与包容力，适合管理与实业方向。',
                cities: ['郑州', '武汉', '西安', '成都', '合肥', '太原', '南昌'],
                suggestion: '中部属土，为日主根基之地。中原及中西部核心城市发展潜力大，基建、制造、地产、政务相关领域机会多，利于你稳扎稳打、积累资源。'
            },
            '己': {
                element: '阴土',
                elementType: '土',
                desc: '温和包容，心思细腻，擅长规划与服务，适合后勤、运营、教育类工作。',
                cities: ['郑州', '武汉', '西安', '成都', '合肥', '太原', '南昌'],
                suggestion: '中部土气场最稳，能给你安全感。内陆中心城市生活成本适中，教育、医疗、公共服务体系完善，适合长期定居与平稳发展。'
            },
            '庚': {
                element: '阳金',
                elementType: '金',
                desc: '刚毅果断，逻辑清晰，有很强的执行力，适合金融、法律、技术硬核领域。',
                cities: ['西安', '成都', '重庆', '兰州', '昆明', '西宁', '银川'],
                suggestion: '西方属金，与日主气场呼应。西南、西北地区军工、制造、金融、能源产业基础雄厚，适合你发挥专业能力，走技术或管理精英路线。'
            },
            '辛': {
                element: '阴金',
                elementType: '金',
                desc: '精致内敛，追求品质，审美能力出众，适合设计、珠宝、金融、精细制造。',
                cities: ['西安', '成都', '重庆', '兰州', '昆明', '西宁', '银川'],
                suggestion: '西方金地利于辛金打磨成色。西部核心城市文旅、消费升级、高端制造产业增速快，适合你凭借专业审美和精细能力脱颖而出。'
            },
            '壬': {
                element: '阳水',
                elementType: '水',
                desc: '聪慧灵动，适应性强，思路开阔，擅长资源整合，适合贸易、物流、互联网。',
                cities: ['北京', '天津', '沈阳', '哈尔滨', '济南', '石家庄', '长春'],
                suggestion: '北方属水，为日主得地之所。北方政治、文化、科创中心资源集中，互联网、金融、教育、进出口贸易赛道广阔，利于你拓宽人脉与格局。'
            },
            '癸': {
                element: '阴水',
                elementType: '水',
                desc: '聪慧敏感，直觉力强，富有想象力，适合艺术、策划、研究、服务类领域。',
                cities: ['北京', '天津', '沈阳', '哈尔滨', '济南', '石家庄', '长春'],
                suggestion: '北方水地可滋养你的智慧。京津冀及北方核心城市文化、教育、科研资源丰富，适合你从事创意、策划、技术研发等需要深度思考的工作。'
            }
        };

        // 主测算函数
        function calculate() {
            const year = parseInt(document.getElementById('year').value);
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            const captchaInput = document.getElementById('captchaInput').value.trim().toUpperCase();
            const errorTip = document.getElementById('errorTip');

            // 校验验证码
            if (captchaInput !== currentCaptcha) {
                errorTip.textContent = '验证码错误，请重新输入';
                generateCaptcha();
                document.getElementById('captchaInput').value = '';
                return;
            }

            errorTip.textContent = '';

            // 计算日主
            const daymaster = getDayMaster(year, month, day);
            const data = daymasterData[daymaster];

            // 填充结果
            document.getElementById('daymasterText').textContent = daymaster + ' 日主';
            document.getElementById('elementText').textContent = '五行属性：' + data.element;
            document.getElementById('descText').textContent = data.desc;

            // 填充城市
            const cityList = document.getElementById('cityList');
            cityList.innerHTML = '';
            data.cities.forEach(city => {
                const tag = document.createElement('span');
                tag.className = 'city-tag';
                tag.textContent = city;
                cityList.appendChild(tag);
            });

            document.getElementById('suggestionText').textContent = data.suggestion;

            // 切换显示
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
        }

        // 重置表单
        function resetForm() {
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('captchaInput').value = '';
            generateCaptcha();
        }

        // 页面初始化
        window.onload = function() {
            initDateSelect();
            generateCaptcha();
            // 点击验证码刷新
            document.getElementById('captchaCanvas').addEventListener('click', generateCaptcha);
        };
    </script>
</body>
</html>
